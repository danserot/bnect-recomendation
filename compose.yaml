services:
  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5174}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    init: true
    environment:
      RUNTIME_MODE: docker
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://bnect:bnect_local_demo@db:5432/bnect_demo
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-761b726}
      EMBEDDING_DIMENSIONS: 384
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-tender-v1}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      MODEL_CACHE_DIR: /app/.cache/models
      DEMO_NOW: ${DEMO_NOW:-2026-10-23T09:00:00.000Z}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3001}:3001'
    volumes:
      - ./data:/app/data:ro
      - ./.cache/models:/app/.cache/models:ro
      - bnect_reports:/app/output
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: bnect
      POSTGRES_PASSWORD: bnect_local_demo
      POSTGRES_DB: bnect_demo
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - bnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bnect -d bnect_demo']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bnect_pgdata:
  bnect_reports:
